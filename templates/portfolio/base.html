{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Samantha Bruner - Portfolio{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner container">
            <a class="brand" href="{% url 'portfolio:home' %}">Samantha Bruner's Portfolio</a>
            <div class="header-nav-group">
                <a class="nav-home nav-link" href="{% url 'portfolio:home' %}">Home</a>
                <button class="menu-button" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="site-navigation">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <nav class="nav-menu" id="site-navigation" aria-label="Main navigation">
                    <a class="nav-link" href="{% url 'portfolio:about' %}">About</a>
                    <a class="nav-link" href="{% url 'portfolio:projects' %}">Projects</a>
                    <a class="nav-link" href="{% url 'portfolio:skills' %}">Skills</a>
                    <a class="nav-link" href="{% url 'portfolio:resume' %}">Resume</a>
                    <a class="nav-link" href="{% url 'portfolio:contact' %}">Contact</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-left">&copy; 2026 Samantha Bruner</div>
            <div class="footer-right">
                <a href="https://www.linkedin.com/in/samantha-bruner-284989256/" target="_blank">LinkedIn</a>
                <a href="mailto:samanthabruner05@gmail.com">Email</a>
            </div>
        </div>
    </footer>

    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
